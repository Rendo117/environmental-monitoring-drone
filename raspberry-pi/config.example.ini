; Copy to config.ini and fill in. NEVER commit config.ini (it is in .gitignore).
[firebase]
database_url = https://YOUR-PROJECT-default-rtdb.europe-west1.firebasedatabase.app
api_key      = YOUR_WEB_API_KEY
email        = drone1@example.com
password     = CHANGE_ME

[drone]
id              = drone1
poll_hz         = 10
; seconds without a new command before the pulses are switched off
command_timeout = 1.0

[pins]
; BCM numbering (= physical pins 12, 13, 18, 19 used in the thesis)
yaw      = 18
roll     = 27
pitch    = 24
throttle = 10

[serial]
port = /dev/serial0
baud = 115200

[sensors]
; run:  python3 bridge.py --calibrate-mq2 <adc in clean air>
mq2_r0_kohm = 1.0
mq2_rl_kohm = 1.0
; SBM-20 | J305 | M4011
geiger_tube = SBM-20
